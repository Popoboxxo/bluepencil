<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluepencil parity fixture</title>
<!--
  Functional-parity fixture (tests/e2e/parity.e2e.mjs).

  This ONE document is served by the harness in two variants, at the same path (`/`) on two
  ports:

    * embed  — the loader-slot comment in the body is replaced with the one-tag loader
               (`/dist/attach.js`), which mounts the layer itself;
    * extension — the placeholder is left empty, so the page carries no embed and the MV3
               extension is the only source of the layer (it mounts unforced).

  The body markup is byte-identical in both variants, which is what makes the per-case comparison
  meaningful: the same anchor target, the same CSS path and the same window size on both sides.

  Targets carry `data-testid` (the layer's documented anchor hook, D6) so a note's `hook` is the
  same stable handle in both strands.
-->
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #14181d;
    background: #f4f5f7;
  }
  /*
    The layer's bar is fixed to the top of the viewport (FR-12.10). Its width depends on the UI
    language — the embed pins `en`, the extension follows the browser — so on some locales it
    reaches across the left-aligned heading and swallows a real pointer click aimed at the anchor.
    The content therefore starts below the bar, so the same click reaches the same target on both
    sides of the harness whatever language the chrome happens to use.
  */
  main { display: grid; gap: 1rem; max-width: 46rem; padding: 5rem 1.5rem 1.5rem; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; }
  article {
    padding: 1rem;
    background: #ffffff;
    border: 1px solid #d7dce2;
    border-radius: 10px;
  }
  article h2 { margin: 0 0 .35rem; font-size: 1rem; }
</style>
</head>
<body>
  <main>
    <h1 id="parity-title" data-testid="parity-title">Parity fixture</h1>
    <p id="parity-body" data-testid="parity-body">
      The same paragraph, anchored by the same stable hook, on both sides of the harness.
    </p>
    <article id="parity-card" data-testid="parity-card">
      <h2>Card target</h2>
      <p data-testid="parity-card-text">A block target for design notes and captured state.</p>
    </article>
    <!--
      Host behaviour probe (FR-1.9/1.15): a plain click on this button must stay the host's — in
      every capture mode — while Alt+click is the layer's documented exception. The counter is the
      page's own, so the parity case can prove the host listener really ran (or really did not).
    -->
    <button id="parity-button" data-testid="parity-button" type="button">Host action</button>
    <!--
      Design-only target (FR-1.14): deliberately no text content anywhere inside it, so a feature
      capture on this leaf has nothing to quote and must fall back to a captured design context.
    -->
    <div id="parity-empty" data-testid="parity-empty" style="height: 48px; border: 1px dashed #d7dce2; border-radius: 10px;"></div>
  </main>
  <script>
    // Page-owned state, reset by the alt-click parity case before it clicks. Inline is safe here:
    // the fixture is served by the harness with no CSP, and both strands get this exact document.
    window.__parityClicks = 0;
    document.getElementById("parity-button").addEventListener("click", function () {
      window.__parityClicks += 1;
    });
  </script>
  <!--BP_PARITY_LOADER_SLOT-->
</body>
</html>
