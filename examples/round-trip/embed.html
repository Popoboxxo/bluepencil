<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluepencil round-trip fixture — embed loader</title>
<!--
  Round-trip fixture, EMBED strand (tests/e2e/round-trip.e2e.mjs).

  This page is served by the reference hub itself (`node dist/server.js --root <repo root>`), so
  the one-tag loader and its sibling element build are served from the SAME origin as the notes
  API. The `data-endpoint` is therefore ROOT-RELATIVE (`/api/v1/bluepencil`) — the layer writes to
  and reads from the hub in its own origin, no CORS involved.

  The body markup carries `data-testid` anchors (the layer's documented hook), and `main` starts
  below the bar (fixed to the top, FR-12.10), so a real pointer click reaches the anchor instead of
  the layer's own chrome.

  The sibling file `extension.html` is the SAME document shape with NO embed; it is served on a
  separate static origin and the built MV3 extension mounts the layer there. Keeping the two
  documents shape-identical is what makes the two-strand assertions comparable.
-->
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #14181d;
    background: #f4f5f7;
  }
  main { display: grid; gap: 1rem; max-width: 40rem; padding: 5rem 1.5rem 1.5rem; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; }
</style>
</head>
<body>
  <main>
    <h1 id="rt-embed-title" data-testid="rt-embed-title">Round-trip fixture — embed loader</h1>
    <p id="rt-embed-body" data-testid="rt-embed-body">
      The layer arrives through the one-tag loader and stores its notes in the hub on this origin.
    </p>
  </main>
  <!-- The documented one-tag embed (FR-17). `data-endpoint` is root-relative on purpose: this page
       is served by the hub, so the layer talks to the same origin it was loaded from. -->
  <script src="/dist/attach.js"
          data-endpoint="/api/v1/bluepencil"
          data-environment="dev"
          data-language="en"
          data-route="url"
          data-identity="anonymous"></script>
</body>
</html>
