<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluepencil round-trip fixture — MV3 extension</title>
<!--
  Round-trip fixture, EXTENSION strand (tests/e2e/round-trip.e2e.mjs).

  Same document shape as `embed.html`, but this page carries NO embed of its own and is served on a
  SEPARATE static origin (a plain static file server, not the hub). The built MV3 extension is the
  only source of the layer: its service worker injects and mounts on this tab, and the layer stores
  its notes in the hub over HTTP (cross-origin, hence the hub is started with `--cors "*"`).

  No `<meta http-equiv="Content-Security-Policy">` on purpose: a strict `script-src`/`connect-src`
  fixture would block the cross-origin call to the hub before the layer could make it. CSP survival
  is the extension smoke's own case (extension/smoke.mjs); this fixture is about the round trip.
-->
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: #14181d;
    background: #f4f5f7;
  }
  main { display: grid; gap: 1rem; max-width: 40rem; padding: 5rem 1.5rem 1.5rem; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; }
</style>
</head>
<body>
  <main>
    <h1 id="rt-ext-title" data-testid="rt-ext-title">Round-trip fixture — MV3 extension</h1>
    <p id="rt-ext-body" data-testid="rt-ext-body">
      The layer arrives through the built MV3 extension and stores its notes in the hub over HTTP.
    </p>
  </main>
</body>
</html>
