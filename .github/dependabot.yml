version: 2

# The library has no runtime dependencies, so most of this is about the toolchain. Grouped and
# weekly: a quiet repository should produce one reviewable pull request, not twenty.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
