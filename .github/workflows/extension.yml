name: extension

# Builds the Chromium extension on every push to main, so there is always a download that matches
# the merged source, and packages it as a versioned zip.
#
# It deliberately does NOT create releases: the `release` workflow owns tags, runs the checks and
# attaches the zip. Two workflows publishing the same release was a race over the release body —
# whichever ran first decided whether the notes were the changelog or auto-generated.
#
# The ordinary CI workflow already runs `build:ext` and `smoke:ext` on pull requests, so this one
# exists to produce the *packaged* thing rather than to test it. It still smokes it, because a zip
# that does not mount is worse than no zip.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      # The element bundle the extension injects is built from src/, so the
      # extension cannot be built before the library is.
      - name: build the library
        run: npm run build

      - name: build the extension
        run: npm run build:ext

      # Re-run the smoke test on the CI machine. It is the only check that proves the layer actually
      # mounts under a strict page CSP, and a build that passes on a laptop can still fail here.
      - name: verify it mounts in a real browser
        env:
          BP_REQUIRE_BROWSER: "1"
        run: npm run smoke:ext

      - name: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-artifacts
          (cd extension/dist && zip -qr ../../dist-artifacts/"bluepencil-extension-${version}.zip" . -x '.*')
          ls -la dist-artifacts/

      - name: summarise
        run: |
          {
            echo "### Extension build"
            echo
            cat extension/dist/build-info.json
            echo
            echo 'Unpacked for a local install: `extension/dist`'
            echo
            echo 'A tag gets this zip attached to its release by the `release` workflow; here it is a build artefact with a 14-day lifetime.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bluepencil-extension
          path: dist-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
