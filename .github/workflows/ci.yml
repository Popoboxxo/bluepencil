# Continuous integration (NFR-3, NFR-11, NFR-13).
#
# The pipeline mirrors what the local `npm run verify` does, plus the smoke scripts that exercise
# the headless and the embedded surfaces with real processes:
#   - cli-smoke: exit codes, conflict refusal, environment isolation, atomic writes
#   - mcp-smoke: JSON-RPC handshake, read-only default, environment binding, import fidelity
#   - pack-smoke: every path of the exports map exists, imports and is published
#   - install-smoke: the package installs from a tarball and every documented subpath resolves by
#     package specifier from the installed copy; the git `prepare`-on-install leg is a non-blocking
#     diagnostic (required gate is the tarball leg only)
#   - embed-smoke: the hub HTTP contract, the element against a running API, and the attach
#     loader in a real browser (the fixture website examples/attach plus a live version swap)
#
#   - e2e-vanilla: the fixture app itself — the manual checklist from examples/vanilla/README.md,
#     automated in a real browser (annotate, filter, thread, export, lifecycle). It shares the
#     dependency-free CDP layer with the embed smoke (scripts/lib/browser.mjs), so no test framework
#     has to be installed to run it (NFR-4, NFR-11).
#
#   - parity: the same layer, two arrival paths. One fixture document is served at the same path on
#     two loopback ports; strand "embed" loads the layer through the one-tag loader (dist/attach.js),
#     strand "extension" lets the built MV3 extension mount the active tab, unforced. The fixed case
#     matrix (layer-mounted, capture-anchor, note-fields, design-context, export-canonical) must
#     produce identical observations once normalize() has scrubbed the volatile ids, timestamps and
#     ports, so any divergence is a real behavioural difference. The run prints a
#     `case | embed | extension | parity` matrix and exits non-zero on any failure or divergence
#     (NFR-11).
#
#   - ext-smoke: the built MV3 extension loaded into a real Chrome — the MAIN-world injection, a page
#     with a strict CSP, and the element loading from the extension's own origin. Nothing about this
#     is reproducible in jsdom, so it is the only leg that can fail on a browser-behaviour regression.
#     The extension sources are typechecked with their own config (`npm run typecheck:ext`): the root
#     tsconfig does not include `extension/`, and a typecheck that skips a quarter of the shipped code
#     is worse than none.
#
#   - round-trip: the whole closed loop in one observed run — both browser strands (the one-tag embed
#     loader and the built MV3 extension) write a note to the hub, an agent reads it and answers over
#     the hub's MCP door, and the answer comes back into the browser on the next reload. It is the only
#     leg that proves the two doors share one store end to end (FR-16.8/16.9, NFR-11).
#
#   - spec: regenerates spec/ from docs/REQUIREMENTS.md and validates it with reqmd, so a
#     malformed requirement block fails the build. The regeneration step also proves the committed
#     spec/ matches the source table — a drifted spec fails instead of passing silently.
#
#   - webstore-compliance: the manifest, the shipped code and the dashboard copy (docs/WEBSTORE.md)
#     against the Chrome Web Store program policies. Its hard checks are MV3, no remote code, no
#     obfuscation, the permission set, and that every permission is justified in the copy — so the
#     form cannot drift away from the artefact. Judgement calls (permission breadth, in-product
#     disclosure) are printed as ADVICE and never fail the build.
#
# The real-browser legs need a Chrome/Chromium; the runner image ships one, and BP_REQUIRE_BROWSER=1
# makes a missing browser a failure so the browser round cannot be skipped silently.
name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:

# A superseded run of the same branch has nothing left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    # The spec check needs no Node: it is a Go binary plus a Python generator. Keeping it in its
    # own job means a broken requirement block reports fast and does not queue behind the browser legs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install reqmd
        run: |
          # Prebuilt single binary, checksum verified against the release manifest.
          curl -sSL -o reqmd https://github.com/dVoo/reqmd/releases/download/v0.2-alpha/reqmd-linux-amd64
          curl -sSL -o SHA256SUMS.txt https://github.com/dVoo/reqmd/releases/download/v0.2-alpha/SHA256SUMS.txt
          grep 'reqmd-linux-amd64$' SHA256SUMS.txt | sed 's/reqmd-linux-amd64/reqmd/' | sha256sum -c -
          chmod +x reqmd
          sudo mv reqmd /usr/local/bin/reqmd
          reqmd --version

      - name: Regenerate spec from docs/REQUIREMENTS.md
        run: python3 scripts/build-reqmd-spec.py

      - name: Spec is in sync with the source table
        run: |
          # A dirty worktree here means spec/ no longer matches docs/REQUIREMENTS.md.
          # Failing loudly beats validating a stale spec.
          if [ -n "$(git status --porcelain spec/)" ]; then
            echo "::error::spec/ is out of sync with docs/REQUIREMENTS.md — run 'npm run spec'"
            git --no-pager diff --stat spec/
            git --no-pager diff spec/ | head -100
            exit 1
          fi

      - name: Validate requirements (reqmd check)
        run: reqmd check spec/

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck extension
        # Its own config: browser libs, no Node types. Not covered by the root tsconfig above.
        run: npm run typecheck:ext

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size guard
        run: npm run size

      - name: CLI smoke
        run: npm run smoke:cli

      - name: MCP smoke
        run: npm run smoke:mcp

      - name: Packaging smoke
        run: npm run smoke:pack

      - name: Embed smoke (hub + element + attach loader + fixture website)
        env:
          # The real-browser leg is the only one that runs the shipped attach.js as a script tag;
          # fail instead of skipping when the runner has no browser.
          BP_REQUIRE_BROWSER: "1"
        run: npm run smoke:embed

      - name: E2E suite (fixture app, real browser)
        env:
          # NFR-11: the automated form of examples/vanilla/README.md; a missing browser must fail
          # here as well instead of turning the whole suite into a skip.
          BP_REQUIRE_BROWSER: "1"
        run: npm run smoke:e2e

      - name: Bookmarklet smoke (post-load IIFE arrival, real browser)
        env:
          # The IIFE is injected into a page that is already loaded — the bookmarklet's defining
          # property — and a strict `script-src 'self'` fixture must genuinely block it (NFR-6).
          # A missing browser has to fail here rather than turn the leg into a silent no-op.
          BP_REQUIRE_BROWSER: "1"
        run: npm run smoke:bookmarklet

      - name: Build extension (MV3)
        run: npm run build:ext

      - name: Chrome Web Store compliance
        # The manifest, the shipped code and the dashboard copy (docs/WEBSTORE.md) are checked against
        # the store's program policies here. It runs on the built extension, so a permission added to
        # the manifest without a justification in the copy fails the build instead of the review.
        run: npm run smoke:webstore

      - name: Build the policy site
        # `docs/PRIVACY.md` is the single source for the URL the store form points at. The Pages
        # workflow renders it, but only on main — this catches a renderer that lost the Limited Use
        # sentence (or the document outline) before the policy is published.
        run: npm run build:site

      - name: Extension smoke (MV3 extension in a real Chrome)
        env:
          # Loads the built extension into Chrome and needs a browser for every one of its checks;
          # a missing Chrome has to fail here rather than turn the leg into a silent no-op.
          BP_REQUIRE_BROWSER: "1"
        run: npm run smoke:ext

      - name: Round-trip smoke (browser → hub → MCP agent → browser, both strands)
        env:
          # Drives the whole loop in a real browser for BOTH arrival paths (one-tag embed loader and
          # the built MV3 extension) and the hub's MCP door from Node; a missing browser must fail
          # here rather than reduce the closed-loop proof to a skip (FR-16.8/16.9, NFR-11).
          BP_REQUIRE_BROWSER: "1"
        run: npm run smoke:round-trip

      - name: Secret scan
        run: npm run secret-scan

  parity:
    # NFR-11: the same layer must behave identically however it arrives on the page. This dedicated
    # job exists so the required check is literally called "parity": it builds both arrival paths and
    # fails red on any divergence between the embed-loader strand and the MV3-extension strand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build extension (MV3)
        run: npm run build:ext

      - name: Functional parity (embed loader vs MV3 extension)
        env:
          # The whole point of this leg is the comparison, so a missing Chrome has to fail it rather
          # than turn it into a skip.
          BP_REQUIRE_BROWSER: "1"
        run: npm run smoke:parity

  install:
    # A package a consumer cannot install is not shipped. `pack-smoke` proves the exports map is
    # right *in the repo*; this job proves it is right from the *installed tarball*: it packs,
    # installs the tarball into a scratch project and imports every subpath by package specifier, so
    # Node's real resolution runs against `node_modules/bluepencil` (FR-10.2, FR-15.1, NFR-16).
    #
    # The tarball leg is the REQUIRED (fail-red) gate: the package has no runtime dependencies, so it
    # is offline and deterministic. The git leg (`github:…#<sha>`) is a NON-BLOCKING diagnostic — a
    # fork PR's head SHA does not exist on the base repo `Popoboxxo/bluepencil` (the install would
    # 404) and the leg needs npm/GitHub network, so neither may block a packaging change; on main
    # pushes the ref is present and it normally passes. `continue-on-error: true` keeps it advisory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install smoke (tarball)
        # Required gate: pack → install the tarball → import every exports subpath by specifier.
        run: npm run smoke:install

      - name: Install smoke (git prepare-on-install, non-blocking diagnostic)
        # Advisory only: `prepare` must build dist/ during a git install. Never the gate (see job note).
        continue-on-error: true
        env:
          BP_INSTALL_GIT_REF: ${{ github.sha }}
        run: npm run smoke:install:git

  image:
    # The Dockerfile is a shipped artefact (FR-6.14), so it is built and *run* on every change instead
    # of being discovered broken on release day. The build also proves the runtime stage: it copies the
    # bundle without `node_modules`, so an image that secretly needs an install step fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bluepencil-hub:ci

      - name: Run the image — it must answer, and say the truth about its binding
        run: |
          set -euo pipefail
          docker run --rm -d --name bp-hub -p 8787:8787 -v bp-notes:/data bluepencil-hub:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/v1/bluepencil/config -o /tmp/config.json; then break; fi
            sleep 1
          done
          cat /tmp/config.json
          # A container that bound loopback would be unreachable, so the entrypoint must have generated
          # a credential and bound beyond it — and the answer has to admit both.
          node -e '
            const config = require("/tmp/config.json");
            if (config.auth !== "secret") throw new Error("expected a generated credential, got " + config.auth);
            if (config.bind.loopbackOnly !== false) throw new Error("the container must bind beyond loopback");
            if (!config.name) throw new Error("the hub must name itself");
          '
          docker logs bp-hub 2>&1 | head -20
          # The generated credential is enforced, not decorative.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/v1/bluepencil/notes)" = "401"
          docker exec bp-hub wget -q -O /dev/null http://127.0.0.1:8787/api/v1/bluepencil/health || true
          docker rm -f bp-hub
