# The hub in Docker — three lines and it runs (FR-6.14).
#
#   docker compose up -d
#   docker compose logs hub | head -20      # the address and the credential
#
# The credential is generated on the first start and kept in the named volume, so a restart does not
# invalidate the clients that already saved it. Set `BLUEPENCIL_AUTH_SECRET` to bring your own.

services:
  hub:
    # Exact version, never `:latest`: a restart must not silently change the code under an
    # operator. Update by bumping this tag (or BLUEPENCIL_IMAGE); digest pinning for production
    # deployments is documented in docs/DOCKER.md, but is not the compose default.
    image: ${BLUEPENCIL_IMAGE:-ghcr.io/popoboxxo/bluepencil:0.12.0}
    # Building from this checkout instead of pulling the published image:
    # build: .
    container_name: bluepencil-hub
    restart: unless-stopped
    ports:
      # Host loopback only. Widening this (e.g. "0.0.0.0:…") is a deliberate edit that exposes
      # the credential-gated API to the network; see docs/DOCKER.md before you change it.
      - "127.0.0.1:${BLUEPENCIL_PORT:-8787}:8787"
    # Hardening defaults (G11): the image writes only to the /data volume and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - bluepencil-notes:/data
    environment:
      # How the hub introduces itself in `GET {base}/config` — "Unraid" is easier to pick from a list
      # than a container id.
      BLUEPENCIL_NAME: "${BLUEPENCIL_NAME:-bluepencil-hub}"
      # BLUEPENCIL_AUTH_SECRET            # leave unset: generated on the first start, kept in /data
      # BLUEPENCIL_TOKEN_KEY              # literal HMAC key (no file-path lookup) for signed, revocable
      #                                   # tokens — *in addition* to the shared secret, never instead of it
    # Extra flags go straight to the hub: run read-only, use another base path, mirror to Markdown.
    # command: ["--read-only"]

volumes:
  bluepencil-notes:
